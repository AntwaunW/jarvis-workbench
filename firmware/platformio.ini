[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200          ; must match Serial.begin(115200) or you get garbage text

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; Tell TFT_eSPI "my settings are here, ignore your User_Setup.h file"
    -DUSER_SETUP_LOADED=1

    ; --- Driver chip (the screen's little brain) ---
    -DILI9341_2_DRIVER=1
    ; If the screen is white, garbled, or has wrong colors, comment out the line
    ; above and uncomment these (common on the 2-USB CYD):
    ; -DST7789_DRIVER=1
    ; -DTFT_INVERSION_ON=1        ; try OFF if colors look inverted

    ; --- Screen size in its default (portrait) orientation ---
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; --- SPI pins: which ESP32 GPIO wires go to the screen ---
    -DUSE_HSPI_PORT=1             ; CYD screen is on the HSPI bus (touch uses the other one)
    -DTFT_MISO=12                 ; Master In, Slave Out: data FROM screen to ESP32
    -DTFT_MOSI=13                 ; Master Out, Slave In: data TO screen
    -DTFT_SCLK=14                 ; Serial Clock: the "beat" both sides follow
    -DTFT_CS=15                   ; Chip Select: "hey screen, I'm talking to YOU"
    -DTFT_DC=2                    ; Data/Command: is this byte a pixel or an instruction?
    -DTFT_RST=-1                  ; -1 = no dedicated reset pin (tied to board reset)

    ; --- Backlight (the light behind the pixels) ---
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH       ; HIGH on GPIO 21 = light on

    ; --- Fonts: with USER_SETUP_LOADED, nothing loads unless you ask ---
    -DLOAD_GLCD=1                 ; font 1, tiny built-in
    -DLOAD_FONT2=1                ; font 2, small
    -DLOAD_FONT4=1                ; font 4, medium (we use this one)
    -DLOAD_FONT6=1                ; font 6, large digits only (good for a clock later)
    -DLOAD_FONT7=1                ; font 7, 7-segment style digits
    -DLOAD_FONT8=1                ; font 8, extra-large digits
    -DLOAD_GFXFF=1                ; FreeFonts (Adafruit-style fonts)
    -DSMOOTH_FONT=1               ; anti-aliased fonts, needed for LVGL-style polish later

    ; --- SPI speed ---
    -DSPI_FREQUENCY=55000000      ; 55 MHz for writing pixels (drop to 40000000 if you see glitches)
    -DSPI_READ_FREQUENCY=20000000 ; reading from the screen must be slower

